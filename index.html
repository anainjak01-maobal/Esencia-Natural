<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esencia Natural | Jabones naturales en Maicao, La Guajira</title>
<meta name="description" content="Esencia Natural: jabones inspirados en ingredientes naturales. El cuidado que nace de la naturaleza. Maicao, La Guajira.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="--accent: {{accent}}; font-family: 'DM Sans', system-ui, sans-serif; color: #1E2B24; background: #F7F2E8; line-height: 1.6; font-size: 17px; width: 100%; overflow-x: hidden">

<!-- INICIO: LANDING A PANTALLA COMPLETA -->
<section id="inicio" style="position: relative; overflow: hidden; min-height: 100vh; background: #12291D; color: #F7F2E8; display: flex; flex-direction: column">

  <!-- Escena de fondo -->
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMaxYMid slice" role="img" aria-label="Escena de jabones naturales sobre una base de piedra, rodeados de helechos, hojas de sábila y gotas de agua, con luz cálida" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
    <defs>
      <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D4331"/><stop offset=".6" stop-color="#12291D"/><stop offset="1" stop-color="#0B1B12"/></linearGradient>
      <radialGradient id="hglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F7D58A" stop-opacity=".75"/><stop offset=".5" stop-color="#F0B94B" stop-opacity=".2"/><stop offset="1" stop-color="#F0B94B" stop-opacity="0"/></radialGradient>
      <linearGradient id="hslab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6EEDC"/><stop offset="1" stop-color="#CDBF9F"/></linearGradient>
      <filter id="hb24" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
      <filter id="hb10" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="hb4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter>
      <g id="hfern">
        <path d="M0 0C-6-120-2-220 10-330" stroke="#3E7A47" stroke-width="6" fill="none" stroke-linecap="round"/>
        <g fill="#4F8A4B">
          <ellipse cx="-34" cy="-50" rx="12" ry="44" transform="rotate(58 -34 -50)"/><ellipse cx="34" cy="-50" rx="12" ry="44" transform="rotate(-58 34 -50)"/>
          <ellipse cx="-33" cy="-100" rx="12" ry="42" transform="rotate(58 -33 -100)"/><ellipse cx="33" cy="-100" rx="12" ry="42" transform="rotate(-58 33 -100)"/>
          <ellipse cx="-31" cy="-150" rx="11" ry="38" transform="rotate(58 -31 -150)"/><ellipse cx="33" cy="-150" rx="11" ry="38" transform="rotate(-58 33 -150)"/>
          <ellipse cx="-28" cy="-200" rx="10" ry="34" transform="rotate(58 -28 -200)"/><ellipse cx="34" cy="-200" rx="10" ry="34" transform="rotate(-58 34 -200)"/>
          <ellipse cx="-24" cy="-250" rx="9" ry="29" transform="rotate(58 -24 -250)"/><ellipse cx="36" cy="-250" rx="9" ry="29" transform="rotate(-58 36 -250)"/>
          <ellipse cx="-18" cy="-296" rx="8" ry="24" transform="rotate(58 -18 -296)"/><ellipse cx="38" cy="-296" rx="8" ry="24" transform="rotate(-58 38 -296)"/>
          <ellipse cx="10" cy="-335" rx="7" ry="22"/>
        </g>
      </g>
      <g id="hAvena"><g transform="rotate(-5 150 105)"><rect x="62" y="62" width="176" height="108" rx="26" fill="#CDB88C"/><rect x="62" y="50" width="176" height="108" rx="26" fill="#E9D9B8"/><rect x="76" y="58" width="148" height="26" rx="13" fill="#fff" opacity=".3"/><g fill="#B98B4A"><ellipse cx="120" cy="112" rx="6" ry="13" transform="rotate(-30 120 112)"/><ellipse cx="146" cy="104" rx="6" ry="13" transform="rotate(20 146 104)"/><ellipse cx="174" cy="116" rx="6" ry="13" transform="rotate(-15 174 116)"/><ellipse cx="200" cy="106" rx="6" ry="13" transform="rotate(35 200 106)"/><ellipse cx="160" cy="134" rx="6" ry="13" transform="rotate(60 160 134)"/></g></g></g>
      <g id="hMiel"><g transform="rotate(-5 150 105)"><rect x="62" y="62" width="176" height="108" rx="26" fill="#D79A2B"/><rect x="62" y="50" width="176" height="108" rx="26" fill="#F0B94B"/><rect x="76" y="58" width="148" height="26" rx="13" fill="#fff" opacity=".3"/><g fill="#fff" fill-opacity=".25" stroke="#A8650F" stroke-width="2.4" stroke-linejoin="round"><polygon points="130,88 144,96 144,112 130,120 116,112 116,96"/><polygon points="158,88 172,96 172,112 158,120 144,112 144,96"/><polygon points="144,112 158,120 158,136 144,144 130,136 130,120"/><polygon points="172,112 186,120 186,136 172,144 158,136 158,120"/></g><path d="M208 90c9 13 13 19 13 25a13 13 0 0 1-26 0c0-6 4-12 13-25z" fill="#A8650F"/></g></g>
      <g id="hLav"><g transform="rotate(-5 150 105)"><rect x="62" y="62" width="176" height="108" rx="26" fill="#A99BCB"/><rect x="62" y="50" width="176" height="108" rx="26" fill="#CBBFE3"/><rect x="76" y="58" width="148" height="26" rx="13" fill="#fff" opacity=".3"/><path d="M150 148V72" stroke="#5E4A8C" stroke-width="3.5" stroke-linecap="round"/><g fill="#7B64A8"><ellipse cx="141" cy="84" rx="6" ry="10" transform="rotate(-25 141 84)"/><ellipse cx="159" cy="84" rx="6" ry="10" transform="rotate(25 159 84)"/><ellipse cx="140" cy="102" rx="6" ry="10" transform="rotate(-25 140 102)"/><ellipse cx="160" cy="102" rx="6" ry="10" transform="rotate(25 160 102)"/><ellipse cx="139" cy="120" rx="6" ry="10" transform="rotate(-25 139 120)"/><ellipse cx="161" cy="120" rx="6" ry="10" transform="rotate(25 161 120)"/><ellipse cx="150" cy="72" rx="5" ry="9"/></g></g></g>
      <g id="hSab"><g transform="rotate(-5 150 105)"><rect x="62" y="62" width="176" height="108" rx="26" fill="#8FBF7F"/><rect x="62" y="50" width="176" height="108" rx="26" fill="#B8D9A5"/><rect x="76" y="58" width="148" height="26" rx="13" fill="#fff" opacity=".3"/><path d="M150 148C132 120 136 84 150 66C164 84 168 120 150 148Z" fill="#3F7A3E"/><path d="M146 148C118 132 104 104 108 82C128 96 146 120 146 148Z" fill="#5E9A58"/><path d="M154 148C182 132 196 104 192 82C172 96 154 120 154 148Z" fill="#5E9A58"/></g></g>
    </defs>

    <rect width="1600" height="900" fill="url(#hbg)"/>
    <circle cx="1180" cy="300" r="560" fill="url(#hglow)"/>
    <g fill="#fff" opacity=".055"><polygon points="1160,-40 1320,-40 980,940 640,940"/><polygon points="1320,-40 1420,-40 1500,940 1160,940"/><polygon points="1000,-40 1080,-40 520,940 330,940"/></g>

    <!-- hojas lejanas desenfocadas -->
    <g filter="url(#hb24)" opacity=".75"><ellipse cx="70" cy="120" rx="100" ry="340" transform="rotate(-38 70 120)" fill="#2F6B45"/><ellipse cx="560" cy="-20" rx="90" ry="260" transform="rotate(30 560 -20)" fill="#1F5237"/><ellipse cx="1560" cy="140" rx="110" ry="330" transform="rotate(34 1560 140)" fill="#2F6B45"/></g>

    <!-- helechos medios -->
    <g class="sway" opacity=".9"><use href="#hfern" transform="translate(1000 760) rotate(-24) scale(1.3)"/></g>
    <g class="sway" opacity=".8" style="animation-delay:-3s"><use href="#hfern" transform="translate(1590 800) rotate(22) scale(1.5)"/></g>
    <g class="sway" opacity=".55" filter="url(#hb4)" style="animation-delay:-5s"><use href="#hfern" transform="translate(820 820) rotate(-40) scale(1.0)"/></g>

    <!-- base de piedra -->
    <ellipse cx="1210" cy="742" rx="470" ry="26" fill="#000" opacity=".35" filter="url(#hb10)"/>
    <rect x="800" y="716" width="820" height="260" rx="34" fill="url(#hslab)"/>
    <rect x="800" y="716" width="820" height="12" rx="6" fill="#fff" opacity=".55"/>

    <!-- jabones -->
    <g class="float" style="animation-delay:-2s"><use href="#hSab" transform="translate(1330 560) scale(1.15)"/></g>
    <use href="#hLav" transform="translate(1000 480) scale(1.3)"/>
    <use href="#hAvena" transform="translate(1110 420) scale(1.5)"/>
    <g class="float"><use href="#hMiel" transform="translate(1208 190) scale(1.2)"/></g>

    <!-- gotas y bokeh -->
    <g fill="#F7D58A" filter="url(#hb10)" opacity=".4"><circle cx="760" cy="200" r="46"/><circle cx="1480" cy="420" r="60"/><circle cx="900" cy="560" r="34"/><circle cx="1130" cy="90" r="38"/></g>
    <g fill="#fff"><g class="float" style="animation-delay:-1s"><path d="M1040 300c9 14 13 21 13 27a13 13 0 0 1-26 0c0-6 4-13 13-27z" opacity=".85"/></g><g class="float" style="animation-delay:-4s"><path d="M1500 250c7 11 10 16 10 21a10 10 0 0 1-20 0c0-5 3-10 10-21z" opacity=".7"/></g><circle cx="1460" cy="610" r="7" opacity=".7"/><circle cx="1000" cy="640" r="5" opacity=".6"/><circle cx="1390" cy="150" r="5" opacity=".6"/></g>

    <!-- primer plano desenfocado -->
    <g class="sway" filter="url(#hb10)" opacity=".85" style="animation-delay:-2s"><use href="#hfern" transform="translate(120 960) rotate(18) scale(2.0)"/></g>
  </svg>

  <!-- Velo para legibilidad -->
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(9,25,17,.9) 0%, rgba(9,25,17,.66) 42%, rgba(9,25,17,.08) 78%), linear-gradient(0deg, rgba(9,25,17,.55) 0%, rgba(9,25,17,0) 40%)"></div>

  <!-- Encabezado sobre la imagen -->
  <header style="position: relative; z-index: 5; width: 100%; max-width: 1240px; margin: 0 auto; padding: 22px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
    <a href="#inicio" style="display: flex; align-items: center; gap: 12px" aria-label="Esencia Natural, inicio">
      <svg width="44" height="44" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="21" fill="#F7F2E8"/><path d="M12 29c0-9 7-15 18-15 0 10-6 17-15 17" fill="#2E4D3B"/><path d="M13 30c5-6 9-9 14-12" stroke="#F7F2E8" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span style="font-family: 'Fraunces', Georgia, serif; font-size: 25px; font-weight: 600; letter-spacing: -0.01em; color: #F7F2E8">Esencia Natural</span>
    </a>
    <nav aria-label="Principal" style="display: flex; flex-wrap: wrap; gap: 2px; align-items: center">
      <a class="hnav" href="#nosotros">Nosotros</a>
      <a class="hnav" href="#productos">Productos</a>
      <a class="hnav" href="#valores">Valores</a>
      <a class="hnav" href="#comunidad">Comunidad</a>
      <a class="hnav" href="#pedido">Cómo pedir</a>
      <a class="hnav" href="#contacto">Contacto</a>
    </nav>
    <a class="btn glass glass-btn" href="{{waGeneral}}" style="color: #F7F2E8; padding: 12px 24px; border-radius: 999px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center">Escríbenos</a>
  </header>

  <!-- Contenido principal -->
  <div style="position: relative; z-index: 4; width: 100%; max-width: 1240px; margin: 0 auto; padding: 40px 24px 36px; flex: 1; display: flex; flex-direction: column; justify-content: center">
    <p class="rise glass" style="margin: 0 0 24px; align-self: flex-start; padding: 8px 18px; border-radius: 999px; font-weight: 700; font-size: 13.5px; letter-spacing: .12em; text-transform: uppercase; color: #F7D58A; animation-delay: .1s">Maicao · La Guajira · Colombia</p>
    <h1 class="rise" style="margin: 0 0 24px; max-width: 800px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(44px, 7.4vw, 100px); line-height: .98; letter-spacing: -0.03em; color: #FFFBF3; animation-delay: .25s">El cuidado que nace de la <span style="color: #F0C06E; font-style: italic">naturaleza.</span></h1>
    <p class="rise" style="margin: 0 0 36px; max-width: 560px; font-size: clamp(17px, 1.6vw, 21px); color: #E4EDE1; animation-delay: .45s">Jabones inspirados en la avena, la miel, la sábila, la lavanda y el coco. Frescura, limpieza y una presentación cuidada para tu rutina diaria.</p>
    <div class="rise" style="display: flex; flex-wrap: wrap; gap: 16px; animation-delay: .65s">
      <a class="btn cta" href="#productos" style="background: #F0B94B; color: #1E2B24; padding: 0 34px; min-height: 58px; border-radius: 999px; font-weight: 700; font-size: 18px; display: inline-flex; align-items: center; gap: 10px">Descubre nuestros productos
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="btn glass glass-btn" href="{{waGeneral}}" style="color: #F7F2E8; padding: 0 30px; min-height: 58px; border-radius: 999px; font-weight: 700; font-size: 18px; display: inline-flex; align-items: center">Pedir por WhatsApp</a>
    </div>
  </div>

  <!-- Leyendas -->
  <div class="rise" style="position: relative; z-index: 4; padding-bottom: 120px; animation-delay: .9s">
    <ul style="list-style: none; max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 12px">
      <li class="glass" style="padding: 10px 20px; border-radius: 999px; font-weight: 500; color: #F7F2E8">Ingredientes inspirados en la naturaleza</li>
      <li class="glass" style="padding: 10px 20px; border-radius: 999px; font-weight: 500; color: #F7F2E8">5 variedades de jabón</li>
      <li class="glass" style="padding: 10px 20px; border-radius: 999px; font-weight: 500; color: #F7F2E8">Hecho en Maicao, La Guajira</li>
    </ul>
  </div>

  <!-- Ola de transición -->
  <svg viewBox="0 0 1600 90" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; z-index: 4; left: 0; bottom: -1px; width: 100%; height: 80px; display: block"><path d="M0 50C200 90 400 90 640 55S1100 0 1360 28 1520 60 1600 50V90H0Z" fill="#FFFBF3"/></svg>
</section>

<!-- NOSOTROS -->
<section id="nosotros" style="background: #FFFBF3; padding: 96px 24px">
  <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px">
    <div style="flex: 1 1 440px; min-width: 0">
      <p style="margin: 0 0 12px; color: #9A5E0F; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 14px">¿Quiénes somos?</p>
      <h2 style="margin: 0 0 24px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(32px, 4vw, 50px); line-height: 1.1; letter-spacing: -0.02em">Alternativas de cuidado personal, inspiradas en la naturaleza.</h2>
      <p style="margin: 0 0 18px; color: #3E4C44">Esencia Natural es un emprendimiento creado con la idea de ofrecer opciones de cuidado personal que aprovechan ingredientes conocidos por su uso tradicional en productos de higiene y cuidado de la piel.</p>
      <p style="margin: 0 0 18px; color: #3E4C44">Estamos ubicados en Maicao, La Guajira, Colombia. Nos caracterizamos por la creatividad, la responsabilidad, el compromiso y el interés por brindar una buena atención a nuestros clientes.</p>
      <p style="margin: 0; color: #3E4C44">Queremos crecer como empresa y convertirnos en una marca reconocida por su identidad natural y por la calidad de su servicio.</p>
    </div>
    <div class="card" style="flex: 1 1 440px; min-width: 0; background: #E4EBDD; border-radius: 28px; padding: 40px">
      <p style="margin: 0 0 12px; color: #9A5E0F; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 14px">Nuestra historia</p>
      <p style="margin: 0 0 16px; font-family: 'Fraunces', Georgia, serif; font-size: 25px; line-height: 1.3">La idea nació al reconocer que muchas personas buscan productos diferentes para su higiene diaria, con presentaciones atractivas y aromas agradables.</p>
      <p style="margin: 0 0 16px; color: #3E4C44">Así decidimos crear una marca de jabones naturales con diferentes opciones para los consumidores. Nuestro propósito es comenzar en Maicao y, con esfuerzo y dedicación, lograr que nuestros productos sean conocidos en otros lugares.</p>
      <p style="margin: 0; color: #3E4C44">Este emprendimiento es una oportunidad para aprender, innovar, desarrollar habilidades empresariales y demostrar que las buenas ideas pueden convertirse en proyectos reales.</p>
    </div>
  </div>
</section>

<!-- PRODUCTOS + CARRITO -->
<section id="productos" style="padding: 96px 24px">
  <div style="max-width: 1240px; margin: 0 auto">
    <div style="max-width: 720px; margin: 0 0 48px">
      <p style="margin: 0 0 12px; color: #9A5E0F; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 14px">Nuestros productos</p>
      <h2 style="margin: 0 0 16px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(32px, 4vw, 50px); line-height: 1.1; letter-spacing: -0.02em">Cinco jabones, cinco formas de cuidarte.</h2>
      <p style="margin: 0; color: #3E4C44">Elige tus favoritos, ajusta las cantidades y envía tu pedido por WhatsApp para confirmar disponibilidad y entrega.</p>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
      <div style="flex: 999 1 640px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px">
        <sc-for list="{{products}}" as="item" hint-placeholder-count="5">
          <article class="card" style="background: #fff; border-radius: 24px; overflow: hidden; border: 1px solid #E7DFCF; display: flex; flex-direction: column">
            <div class="art-wrap" style="background: {{item.tint}}; padding: 18px 12px 6px">
              <sc-if value="{{ item.isAvena }}" hint-placeholder-val="{{ true }}">
                <svg viewBox="0 0 300 210" role="img" aria-label="Jabón de avena con granos de avena" style="width: 100%; height: auto; display: block"><ellipse cx="150" cy="186" rx="98" ry="11" fill="#1E2B24" opacity=".12"/><g transform="rotate(-5 150 105)"><rect x="62" y="62" width="176" height="108" rx="26" fill="#CDB88C"/><rect x="62" y="50" width="176" height="108" rx="26" fill="#E9D9B8"/><rect x="76" y="58" width="148" height="26" rx="13" fill="#fff" opacity=".28"/><g fill="#B98B4A"><ellipse cx="120" cy="112" rx="6" ry="13" transform="rotate(-30 120 112)"/><ellipse cx="146" cy="104" rx="6" ry="13" transform="rotate(20 146 104)"/><ellipse cx="174" cy="116" rx="6" ry="13" transform="rotate(-15 174 116)"/><ellipse cx="200" cy="106" rx="6" ry="13" transform="rotate(35 200 106)"/><ellipse cx="160" cy="134" rx="6" ry="13" transform="rotate(60 160 134)"/><ellipse cx="124" cy="136" rx="6" ry="12" transform="rotate(-60 124 136)"/><ellipse cx="196" cy="136" rx="6" ry="12" transform="rotate(50 196 136)"/></g></g></svg>
              </sc-if>
              <sc-if value="{{ item.isMiel }}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 300 210" role="img" aria-label="Jabón de miel con panal y una gota" style="width: 100%; height: auto; display: block"><ellipse cx="150" cy="186" rx="98" ry="11" fill="#1E2B24" opacity=".12"/><g transform="rotate(-5 150 105)"><rect x="62" y="62" width="176" height="108" rx="26" fill="#D79A2B"/><rect x="62" y="50" width="176" height="108" rx="26" fill="#F0B94B"/><rect x="76" y="58" width="148" height="26" rx="13" fill="#fff" opacity=".28"/><g fill="#fff" fill-opacity=".25" stroke="#A8650F" stroke-width="2.4" stroke-linejoin="round"><polygon points="130,88 144,96 144,112 130,120 116,112 116,96"/><polygon points="158,88 172,96 172,112 158,120 144,112 144,96"/><polygon points="144,112 158,120 158,136 144,144 130,136 130,120"/><polygon points="172,112 186,120 186,136 172,144 158,136 158,120"/></g><path d="M208 90c9 13 13 19 13 25a13 13 0 0 1-26 0c0-6 4-12 13-25z" fill="#A8650F"/></g></svg>
              </sc-if>
              <sc-if value="{{ item.isSabila }}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 300 210" role="img" aria-label="Jabón de sábila con hojas de aloe" style="width: 100%; height: auto; display: block"><ellipse cx="150" cy="186" rx="98" ry="11" fill="#1E2B24" opacity=".12"/><g transform="rotate(-5 150 105)"><rect x="62" y="62" width="176" height="108" rx="26" fill="#8FBF7F"/><rect x="62" y="50" width="176" height="108" rx="26" fill="#B8D9A5"/><rect x="76" y="58" width="148" height="26" rx="13" fill="#fff" opacity=".28"/><path d="M150 148C132 120 136 84 150 66C164 84 168 120 150 148Z" fill="#3F7A3E"/><path d="M146 148C118 132 104 104 108 82C128 96 146 120 146 148Z" fill="#5E9A58"/><path d="M154 148C182 132 196 104 192 82C172 96 154 120 154 148Z" fill="#5E9A58"/></g></svg>
              </sc-if>
              <sc-if value="{{ item.isLavanda }}" hint-placeholder-val="{{ false }}">
